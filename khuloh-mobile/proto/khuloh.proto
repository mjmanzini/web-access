// Khuloh Protocol Buffer definitions
// Compact binary encoding for ultra-low-data messaging & economy transactions
// Achieves ~70% payload reduction vs JSON over the wire

syntax = "proto3";

package khuloh;

// ── Chat Messages ─────────────────────────────────────────

enum VibeType {
  VIBE_CHAT = 0;
  VIBE_CONNECT = 1;
  VIBE_IGNITE = 2;
}

message ChatMessage {
  string id = 1;
  string sender_id = 2;
  string room_id = 3;       // zone room or whisper channel
  string body = 4;
  int64  timestamp_ms = 5;   // unix millis (saves 20 bytes vs ISO string)
  VibeType sender_vibe = 6;
  string sender_username = 7;
  bool   is_whisper = 8;
  bool   is_flagged = 9;
}

message ChatBatch {
  repeated ChatMessage messages = 1;
  int64 server_ts = 2;       // server timestamp for delta-sync anchor
}

// ── Shout (Zone Broadcast) ────────────────────────────────

message ShoutMessage {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string body = 4;
  int32  cost = 5;
  int64  timestamp_ms = 6;
  string sender_username = 7;
  VibeType sender_vibe = 8;
}

// ── Economy Transactions ──────────────────────────────────

enum PointReason {
  REASON_BIO_COMPLETE = 0;
  REASON_SAFE_DATE_REVIEW = 1;
  REASON_SCAMMER_REPORTED = 2;
  REASON_SHOUT_SPENT = 3;
  REASON_GUARDIAN_BONUS = 4;
  REASON_CHECKIN_COMPLETE = 5;
  REASON_DAILY_LOGIN = 6;
  REASON_VERIFIED_MEETUP = 7;
  REASON_CITY_SHOUT = 8;
  REASON_GHOST_MODE = 9;
}

message PointTransaction {
  string id = 1;
  string user_id = 2;
  int32  amount = 3;          // positive = earn, negative = spend
  PointReason reason = 4;
  int64  timestamp_ms = 5;
}

message PointsBatch {
  repeated PointTransaction transactions = 1;
  int32  current_balance = 2;
  int64  last_synced_ms = 3;  // delta-sync anchor
}

// ── Safe Check-in (GPS-verified) ──────────────────────────

message SafeCheckinRequest {
  string safe_spot_id = 1;
  string partner_id = 2;
  double latitude = 3;
  double longitude = 4;
  int64  timestamp_ms = 5;
}

message SafeCheckinResponse {
  bool   success = 1;
  string checkin_id = 2;
  string checkin_code = 3;
  int32  points_awarded = 4;
  string error = 5;
}

// ── QR Badge Verification ─────────────────────────────────

message QrBadgeRequest {
  string user_id = 1;
  string partner_id = 2;     // business partner UUID
  string qr_payload = 3;     // signed token from QR
}

message QrBadgeResponse {
  bool   valid = 1;
  int32  discount_pct = 2;
  int32  points_awarded = 3;
  string partner_name = 4;
  string error = 5;
}

// ── Profile Snapshot (for cache) ──────────────────────────

message ProfileSnapshot {
  string id = 1;
  string username = 2;
  string bio = 3;
  int32  trust_score = 4;
  bool   is_verified = 5;
  VibeType vibe = 6;
  int32  vibe_points = 7;
  bool   data_light_mode = 8;
  bool   ghost_active = 9;
  int64  ghost_until_ms = 10;
  string avatar_thumb = 11;  // base64 10KB blurred thumbnail
}

// ── Safe-Spot Cache ───────────────────────────────────────

message SafeSpotCompact {
  string id = 1;
  string name = 2;
  string category = 3;
  string city = 4;
  double latitude = 5;
  double longitude = 6;
  int32  discount_pct = 7;
  bool   is_active = 8;
}

message SafeSpotCache {
  repeated SafeSpotCompact spots = 1;
  int64 last_synced_ms = 2;
}
