# Reference AdGuard Home settings for Home Guardian.
#
# You do NOT copy this file into place directly (the admin password must be a
# bcrypt hash generated by AdGuard's own setup wizard). Instead:
#   1. `docker compose up -d adguardhome`
#   2. Open http://<host>:3000 and complete the wizard:
#        - Admin Web Interface: port 80
#        - Username / password: match ADGUARD_USERNAME / ADGUARD_PASSWORD in .env
#   3. Then apply the settings below in the AdGuard UI (or edit the persisted
#      conf volume) so the backend's assumptions hold.
#
# The backend talks to the control API at http://adguardhome:80/control with
# HTTP Basic auth using those same credentials.

# --- Settings the backend relies on ---

# Enable per-client configuration (the backend maps one Profile -> one client).
clients:
  # The backend creates/updates clients named "hg-<profileId>" via the API.
  # Leave this managed by the app; don't hand-edit hg-* clients.
  persistent: []

# Recommended upstreams: encrypted DoH so YOUR queries are private, while the
# clients are forced to use AdGuard as their only resolver.
dns:
  upstream_dns:
    - https://dns.quad9.net/dns-query
    - https://cloudflare-dns.com/dns-query
  # Enforce SafeSearch globally as a backstop (also set per-profile by the app).
  safe_search:
    enabled: false # the app toggles this per client
  # Serve DHCP here if you want IP<->MAC<->hostname for device discovery.

# Filters give the category blocklists teeth. The app adds gambling/adult lists
# per policy; these general lists improve coverage.
filters:
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_9.txt
    name: The Big List of Hacked Malware Web Sites
    id: 9

# The app writes its managed rules into user_rules (fenced by a
# "# home-guardian:managed" marker). Anything above that marker is yours.
user_rules: []
