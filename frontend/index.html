<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Home Guardian</title>
    <meta name="description" content="Home Wi-Fi monitoring and parental controls" />
    <!--
      use-credentials is required, not optional, behind Cloudflare Access.
      Chrome fetches the manifest WITHOUT cookies by default; Access then 302s
      it to a login page, Chrome parses HTML as JSON, the manifest is invalid,
      and "Add to Home screen" quietly creates a bookmark instead of installing
      the app — with no error shown anywhere.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#0f1420" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS has no manifest support for install; these are its equivalents. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guardian" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
